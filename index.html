<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/colour.css">
        <script>
            function debug(){
                var script = document.createElement('script');
                script.src='https://cdn.jsdelivr.net/npm/eruda';
                script.onload=function(e){eruda.init();}
                d.body.appendChild(script);
            }
        </script>
        <script src="wm.js"></script>
        <script src="filesys.js"></script>
        <!-- Default Apps-->
        <script src="apps/console.js" defer></script>
        <script src="apps/texteditor.js" defer></script>
        <script src="apps/loupe.js" defer></script>
        <script src="apps/epiphany.js" defer></script>
        <script src="apps/calculator.js" defer></script>
        <script src="apps/nautilus.js" defer></script>
    </head>
    <hidden>
        <div id="window" class="window bg-window">
            <div id="windowheader" class=header></div>
            <br>
            <button class="close" id="close">&times;</button>
        </div>
    </hidden>
    <body>
        <div id="boot-cover"><style>
                             @keyframes load{from{transform: rotate(0);    } 
                                             to  {transform: rotate(1turn);}}
                             </style>
                            <svg style="width:16px;
                                        height:16px;
                                        position:absolute;
                                        top:80%;
                                        left:calc(50% - 8px);
                                        animation: load 3s linear infinite;"
                                 version="1.1"
                                 xmlns="http://www.w3.org/2000/svg"
                                 xmlns:xlink="http://www.w3.org/1999/xlink"
                                 width="86.5"
                                 height="86.51964"
                                 viewBox="0,0,86.5,86.51964">
                                <g transform="translate(-196.875,-136.60536)">
                                    <g data-paper-data="{&quot;isPaintingLayer&quot;:true}"
                                       fill-rule="nonzero"
                                       stroke-linecap="butt"
                                       stroke-linejoin="miter"
                                       stroke-miterlimit="10"
                                       stroke-dasharray=""
                                       stroke-dashoffset="0"
                                       style="mix-blend-mode: normal">
                                        <path d="M202.875,180c0,-20.50357 16.62143,-37.125 37.125,-37.125c20.50357,0 37.125,16.62143 37.125,37.125c0,20.50357 -16.62143,37.125 -37.125,37.125c-20.50357,0 -37.125,-16.62143 -37.125,-37.125z"
                                              fill="none"
                                              stroke="#333333"
                                              stroke-width="12" />
                                        <path d="M238.55669,142.90254c0.47884,-0.0183 0.96,-0.02754 1.44331,-0.02754c20.50357,0 37.125,16.62143 37.125,37.125c0,0.29082 -0.00334,0.58085 -0.01,0.87007"
                                              fill="none"
                                              stroke="#ffffff"
                                              stroke-width="12.5" />
                                        <path d="M233.21819,142.93869c0,-3.4978 2.76091,-6.33333 6.16667,-6.33333c3.40576,0 6.16667,2.83553 6.16667,6.33333c0,3.4978 -2.76091,6.33333 -6.16667,6.33333c-3.40576,0 -6.16667,-2.83553 -6.16667,-6.33333z"
                                              fill="#ffffff"
                                              stroke="none"
                                              stroke-width="0" />
                                        <path d="M270.94736,180.73036c0,-3.35973 2.76557,-6.08333 6.17708,-6.08333c3.41151,0 6.17708,2.7236 6.17708,6.08333c0,3.35973 -2.76557,6.08333 -6.17708,6.08333c-3.41151,0 -6.17708,-2.7236 -6.17708,-6.08333z"
                                              fill="#ffffff"
                                              stroke="none"
                                              stroke-width="0" />
                                    </g>
                                </g>
                            </svg>
        </div>
        <div class="taskbar" id="taskbar">
        </div>
        <desktop id=desktop></desktop>
        <div class="activity-bar" id="activity-bar">If you see this for more than a split second, something's wrong.</div>
        <button id="activity-button" onclick="toggleActivities()">Activities</button>
        <button id="quicksettings-button" onclick="toggleQuicksettings()">
            <img id="network-button" src="symbolic/radiowaves-5-symbolic.svg" title="connected" class="white-icon"/>
            <img id="battery-button" src="symbolic/battery-missing-symbolic.svg" class="white-icon"/>
        </button>
        <div id="quicksettings">
            <label for=brightness-range><img src="symbolic/display-brightness-high-symbolic.svg" class="white-icon"></input>
                <input type=range id=brigtness-range value="100" min="0" max="100" step="1" onchange="$('brightness-cover').style.opacity=(100-this.value)+'%'"></input>
                <table>
                    <tr>    
                <td><button id="fullscreen-button" class="bg-dark" onclick="toggleFullscreen()"><img src="symbolic/fullscreen-square-symbolic.svg" class="white-icon"/> &Tab;Fullscreen</button></td>
                <td><button id="debug-button" class="bg-dark" onclick="debug()"><img src="symbolic/bug-symbolic.svg" class="white-icon"/> &Tab;Debug</button></td>
            </tr><tr>
                <td><button id="darkmode-button" class="bg-dark"><img src="symbolic/dark-mode-symbolic.svg" class="white-icon"/> &Tab;Dark Style</button></td>
                <td><button id="loadfs-button" class="bg-dark" onclick="mountFS()"><img src="symbolic/folder-remote-symbolic.svg" class="white-icon" /> &Tab; Filesystem</button></td>
            </tr>
        </table>
    </div>
    <div id="brightness-cover"></div>
    <div id="login-screen">
        <div style="width:256px;top:calc(40% - 128px);left:calc(50% - 128px);position: absolute;">
        <div class="circle" style="width:140px;height:140px;background-color: var(--dark3);left:calc(50% - 70px);position: absolute;">
            <img src="symbolic/person-symbolic.svg" style="width: 128px;" class="white-icon">
        </div>
        <div style="height:140px"></div>
        <h1 style="color:white;top: calc(50% + 140px);text-align: center;">BlueBaritone21</h1>
        <input id=password-box type=password style="height:30px;width:256px;background-color: var(--dark3);color: var(--light1);" onkeypress=validatePassword()>
        </div>
    </div>
</body>
</html>
