<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/colour.css">
        <script src="wm.js"></script>
        <script src="apps/console.js" defer></script>
        <script src="apps/epiphany.js" defer></script>
        <script src="apps/texteditor.js" defer></script>
        <script src="apps/calculator.js" defer></script>
    </head>
    <hidden>
        <div id="window" class="window bg-window">
            <div id="windowheader" class=header></div>
            <br>
            <button class="close" id="close">&times;</button>
        </div>
    </hidden>
    <body>
        <div class="taskbar" id="taskbar">
        </div>
        <desktop></desktop>
        <img src="https://teams.pages.gitlab.gnome.org/Design/icon-development-kit-www/img/symbolic/ait/radiowaves-5-symbolic.svg" style="position: absolute;top:0;left:0;"/>
        <div class="activity-bar">Loading...</div>
        <button id="activity-button" onclick="toggleActivities()">Activities</button>
        <button id="quicksettings-button" onclick="toggleQuicksettings()">
            <img id="network-button" src="https://teams.pages.gitlab.gnome.org/Design/icon-development-kit-www/img/symbolic/ait/radiowaves-1-symbolic.svg" title="connected" class="white-icon"/>
            <img id="battery-button" />
        </button>
        <div id="quicksettings">
            <button id="fullscreen-button" style="width:100%;" class="bg-dark" onclick="toggleFullscreen()"><img src="https://teams.pages.gitlab.gnome.org/Design/icon-development-kit-www/img/symbolic/ui/fullscreen-square-symbolic.svg" class="white-icon" /><b>Fullscreen</b></button>
            <br>
            <button id="darkmode-button" class="bg-dark"><img src="https://teams.pages.gitlab.gnome.org/Design/icon-development-kit-www/img/symbolic/ui/dark-mode-symbolic.svg" class="white-icon"/> Dark Mode</button>
        </div>
    </body>
</html>
