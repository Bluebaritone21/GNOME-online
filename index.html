<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
        <link rel="stylesheet" href="style.css">
        <script src="wm.js"></script>
        <script src="apps/console.js" defer></script>
        <script src="apps/epiphany.js" defer></script>
        <script src="apps/texteditor.js" defer></script>
    </head>
    <hidden>
        <img src="https://teams.pages.gitlab.gnome.org/Design/icon-development-kit-www/img/symbolic/ait/radiowaves-5-symbolic.svg" />
        <div id="window" class=window>
            <div id="windowheader" class=header></div>
            <br>
            <button class="close" id="close">&times;</button>
        </div>
    </hidden>
    <body>
        <div class="taskbar" id="taskbar">
        </div>
        <desktop>
            <br />
        </desktop>
        <div class="activity-bar">Loading...</div>
        <button id="activity-button" onclick="toggleActivities()">Activities</button>
        <button id="quicksettings-button">
            <img id="network-button" src="https://teams.pages.gitlab.gnome.org/Design/icon-development-kit-www/img/symbolic/ait/radiowaves-1-symbolic.svg" class="white-icon"/>
            <img id="battery-button" />
        </button>
    </body>
</html>
