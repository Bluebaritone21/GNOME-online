<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
    </head>
    <script>
        function time(){
            var d = new Date();
            var month = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
            var date = d.getDate();
            var min = d.getMinutes();
            var hour = d.getHours();
            document.getElementsByClassName("activity-bar")[0].innerHTML = month + " " + date + " " + hour + ":" + min
        }

        setInterval(time,1000);
    </script>
    <style>
        body{
            background-image: url("default-background.webp");
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .activity-bar{
            position: fixed;
            background-color: black;
            color:white;
            width: 100vw;
            height: 30px;
            line-height: 30px;
            font-size: 12pt;
            text-align: center;
            font-weight: bold;
            margin: 0;
        }
    </style>
    <body>
        <div class="activity-bar">Mar 20 09:01</div>
        <script>
            function makeDevTools(){
            var script = document.createElement('script');
                script.src='https://cdn.jsdelivr.net/npm/eruda';
                document.body.appendChild(script); eruda.init();
            }
        </script>
        <br />
        <button onclick="makeDevTools()">debug</button>
    </body>
</html>
