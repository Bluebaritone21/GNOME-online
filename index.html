<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
    </head>
    <hidden>
        <div id="window" class=window>
            <div id="windowheader" class=header></div>
            <p>G'day. This is example text.</p>
        </div>
    </hidden>
    <script>
        function time(){
            var d = new Date();
            var month = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
            var date = d.getDate();
            var min = d.getMinutes();
            if(min.toString().length<2){
                min = "0" + min;
            }
            var hour = d.getHours();
            document.getElementsByClassName("activity-bar")[0].innerHTML = month + " " + date + " " + hour + ":" + min
        }

        setInterval(time,1000);
    </script>
    <style>
        hidden{
            display: none;
        }
        body{
            background-image: url("gnome_example.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .activity-bar{
            position: fixed;
            background-color: black;
            color:white;
            width: 100vw;
            height: 30px;
            line-height: 30px;
            font-size: 12pt;
            text-align: center;
            font-weight: bold;
            margin: 0;
            z-index: 100000;
        }
        .window {
            position: absolute;
            text-align: center;
            border-radius: 10px;
            resize: both;
            overflow: auto;
            background-color:white;
            box-shadow:0 0 5px rgba(0,0,0,0.2);
        }
        #debug-button{
            position: absolute;
            left:    0;
            bottom:   0;
        }
.header {
  padding: 10px;
  cursor: move;
  background-color: none;
}
    </style>
    <body>
        <div class="activity-bar">Loading...</div>
        <br />
        <button id=debug-button onclick="makeDevTools()">debug</button>
        <button onclick="makeWindow()">Make window</button>
    </body>
    <script>
        var gensym = 0;
        function makeDevTools(){
            var script = document.createElement('script');
                script.src='https://cdn.jsdelivr.net/npm/eruda';
                document.body.appendChild(script); eruda.init();
        }
        function makeWindow(){
            gensym++;
            clone = document.getElementById("window").cloneNode(true);
            clone.id = "window"+gensym;
            clone.querySelector("#windowheader").id = "window"+gensym+"header";
            document.getElementsByTagName("body")[0].appendChild(clone);
            dragElement(document.getElementById(window+gensym));
        }
        
        //Make the DIV element draggagle:
        var lastheight = 0;
        
        function dragElement(elmnt) {
          var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
          if (document.getElementById(elmnt.id + "header")) {
            /* if present, the header is where you move the DIV from:*/
            document.getElementById(elmnt.id + "header").onmousedown = dragMouseDown;
          } else {
            /* otherwise, move the DIV from anywhere inside the DIV:*/
            elmnt.onmousedown = dragMouseDown;
          }
        
          function dragMouseDown(e) {
            elmnt.style.zIndex=lastheight;
            e = e || window.event;
            e.preventDefault();
            // get the mouse cursor position at startup:
            pos3 = e.clientX;
            pos4 = e.clientY;
            lastheight++;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
          }
        
          function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            // calculate the new cursor position:
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            // set the element's new position:
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
          }
        
          function closeDragElement() {
            /* stop moving when mouse button is released:*/
            document.onmouseup = null;
            document.onmousemove = null;
          }
        }
        </script>
</html>
