<!DOCTYPE html>
<html>
    <head>
        <title>GNOME</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" href="https://www.gnome.org/img/favicon.png">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/colour.css">
        <script src="wm.js"></script>
        <script src="filesys.js"></script>
        <!-- Default Apps-->
        <script src="apps/console.js" defer></script>
        <script src="apps/epiphany.js" defer></script>
        <script src="apps/texteditor.js" defer></script>
        <script src="apps/loupe.js" defer></script>
        <!--<script src="apps/minecraft.js" defer></script>-->
        <script src="apps/calculator.js" defer></script>
        <script src="apps/nautilus.js" defer></script>
    </head>
    <hidden>
        <div id="window" class="window bg-window">
            <div id="windowheader" class=header></div>
            <br>
            <button class="close" id="close">&times;</button>
        </div>
    </hidden>
    <body>
        <div class="taskbar" id="taskbar">
        </div>
        <desktop></desktop>
        <div class="activity-bar" id="activity-bar">Loading...</div>
        <button id="activity-button" onclick="toggleActivities()">Activities</button>
        <button id="quicksettings-button" onclick="toggleQuicksettings()">
            <img id="network-button" src="symbolic/radiowaves-5-symbolic.svg" title="connected" class="white-icon"/>
            <img id="battery-button" src="symbolic/battery-level-100-symbolic.svg" class="white-icon"/>
        </button>
        <div id="quicksettings">
            <table>
            <tr>    
                <td><button id="fullscreen-button" class="bg-dark" onclick="toggleFullscreen()"><img src="symbolic/fullscreen-square-symbolic.svg" class="white-icon"/> &Tab;Fullscreen</button></td>
                <td><button id="debug-button" class="bg-dark" onclick="debug()"><img src="symbolic/bug-symbolic.svg" class="white-icon"/> &Tab;Debug</button></td>
            </tr><tr>
                <td><button id="darkmode-button" class="bg-dark"><img src="symbolic/dark-mode-symbolic.svg" class="white-icon"/> &Tab;Dark Style</button></td>
                <td><button id="loadfs-button" class="bg-dark" onclick="mountFS()"><img src="symbolic/folder-remote-symbolic.svg" class="white-icon" /> &Tab; Filesystem</button></td>
            </tr>
            </table>
        </div>
    </body>
</html>
